name: Godot regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6 stable
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64
      - name: Run isolated regression suites
        run: python3 tests/run_suites.py --godot /tmp/godot-bin/Godot_v4.6-stable_linux.x86_64 --output "${{ runner.temp }}/gate1-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-evidence
          path: ${{ runner.temp }}/gate1-tests
